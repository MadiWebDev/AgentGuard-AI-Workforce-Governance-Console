services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentguard
      # Dev-only default. Production MUST set POSTGRES_PASSWORD in the environment (never commit a real password).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentguard-dev-only}
      POSTGRES_DB: agentguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: {}
